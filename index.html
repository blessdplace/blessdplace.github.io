<!doctype html>
<textarea id="description" name="description" required aria-required="true" placeholder="Briefly describe the project, location, approximate size, and objectives."></textarea>
</div>


<div>
<label for="area">Approx. area (hectares)</label>
<input id="area" name="area" type="text" inputmode="decimal" pattern="^[0-9]+(?:\.[0-9]{1,2})?$" placeholder="e.g. 12.5">
<div class="hint">Enter area in hectares. Use decimals if needed.</div>
</div>


<div>
<label for="file">Attachments (maps, plans) — optional</label>
<input id="file" name="attachment" type="file" accept="image/*,.pdf" aria-describedby="fileHint">
<div id="fileHint" class="hint">Accepts images or PDF files. Max file size enforced server-side.</div>
</div>


<div class="full">
<label>
<input id="consent" name="consent" type="checkbox" required aria-required="true">
I agree to be contacted and that project information may be used for assessment and reporting.
</label>
<div class="hint">You can include a link to your privacy policy on your site.</div>
</div>


<div class="full actions">
<button type="submit" id="submitBtn">Submit project</button>
<button type="reset" class="secondary">Reset</button>
<div id="formMessage" role="status" aria-live="polite"></div>
</div>
</form>
</div>


<script>
(function(){
const form = document.getElementById('projectForm');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('formMessage');


function showMessage(text, type){
msg.textContent = text;
msg.className = type === 'error' ? 'error' : 'success';
}


form.addEventListener('submit', function(e){
e.preventDefault();
// Basic client-side validation (HTML5 does most of it)
if(!form.checkValidity()){
showMessage('Please fill in required fields correctly.', 'error');
// Let browser show built-in validation UI
form.reportValidity();
return;
}


submitBtn.disabled = true;
showMessage('Sending…', '');


// Example: submit using fetch to the provided action URL (expects JSON response)
const url = form.action || window.location.href;
const formData = new FormData(form);


fetch(url, {
method: form.method || 'POST',
body: formData,
}).then(async res => {
submitBtn.disabled = false;
if(!res.ok){
const text = await res.text().catch(()=> 'Server error.');
showMessage('Submission failed: ' + text, 'error');
return;
}
showMessage('Thank you! Your project has been submitted.', 'success');
form.reset();
}).catch(err => {
submitBtn.disabled = false;
console.error(err);
showMessage('Network error. Please try again later.', 'error');
});
});
})();
</script>
</body>
</html>
